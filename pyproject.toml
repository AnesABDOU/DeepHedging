[project]
name = "deep_hedging"
version = "0.1.0"
description = "A Python package for deep hedging strategies in financial markets."
readme = "README.md"
authors = [
    { name = "AnesABDOU", email = "anes.abdou@etu.sorbonne-universite.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "torch>=2.14.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
notebooks = [
    "matplotlib>=3.11.2",
    "polars>=1.44.2",
]

[tool.uv]
default-groups = ["dev", "notebooks"]
